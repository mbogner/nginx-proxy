services:
  nginx:
    image: nginx:latest
    container_name: nginx
    hostname: nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/nginx/certificates:/etc/ssl/certs/nginx:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/html:/var/www/html:ro
      - ./docker/nginx/includes:/etc/nginx/includes:ro
    links:
      - nginx2

  nginx2:
    image: nginx:latest
    container_name: nginx2
    hostname: nginx2